<!doctype html>
<html>
  <head>
    <link rel="stylesheet" type="text/css" href="styles.css" />
  </head>
  <body>
    <div class="app">
      <div class="container">
        <h1>TODO List</h1>

        <form id="taskForm">
          <label for="task">Task</label>
          <input type="text" id="task" name="task" placeholder="Add task" />
          <button type="submit">Submit</button>
        </form>

        <ul id="taskList"></ul>
      </div>
      <div class="sidebar">
        <h3>Filter</h3>
        <button id="allBtn">All</button>
        <button id="activeBtn">Active</button>
        <button id="completedBtn">Completed</button>
        <h3>Statistics</h3>
        <div class="statistics">
          <p>Total:</p>
          <p id="totalAmnt">0</p>
        </div>
        <div class="statistics">
          <p>Completed:</p>
          <p id="completedAmnt">0</p>
        </div>
        <div class="statistics">
          <p>Remaining:</p>
          <p id="remainingAmnt">0</p>
        </div>
      </div>
    </div>
    <script src="script.js"></script>
  </body>
</html>
